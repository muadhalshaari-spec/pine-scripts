name: Generate Muadhalshaari File

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate 10000 lines
        run: |
          python - <<'PY'
          from pathlib import Path
          Path('معاذ الشعري.pine').write_text(''.join('معاذ الشعري\\n' for _ in range(10000)), encoding='utf-8')
          PY

      - name: Commit generated file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'معاذ الشعري.pine'
          git diff --cached --quiet || git commit -m 'Generate معاذ الشعري.pine with 10000 lines'
          git push
