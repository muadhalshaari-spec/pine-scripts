name: Generate Maad Pine File

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate file
        run: |
          python - <<'PY'
          from pathlib import Path
          Path('معاذ الشعري.pine').write_text('معاذ الشعري\n' * 10000, encoding='utf-8')
          PY
      - name: Commit generated file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'معاذ الشعري.pine'
          git diff --cached --quiet || git commit -m 'Add معاذ الشعري.pine with 10000 repeated lines'
          git push
